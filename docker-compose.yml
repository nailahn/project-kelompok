version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movie_api_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - movie_network

  webserver:
    image: nginx:alpine
    container_name: movie_api_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - movie_network

  db:
    image: mysql:8.0
    container_name: movie_api_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: movie_api_db
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - movie_network

networks:
  movie_network:
    driver: bridge

volumes:
  db_data:
